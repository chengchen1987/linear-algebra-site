<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Reachable plane for C"><title>Reachable plane for C</title><desc>The columns c1 and c2 span w=u+v in output R3. Target (1,2,3) is on the plane; (1,2,4) is outside it. Oblique projection, not a claim about projected distances.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="430" fill="#fff"/><g font-family="DejaVu Sans, sans-serif" font-size="17"><text x="25" y="34" fill="#273c4b" >C [s, t]ᵀ = [s, t, s+t]ᵀ</text><polygon points="463.8,372.25 647.4,172.45 528.6,75.25 345,275.05" fill="#e6f1f4" stroke="#96b7c6" stroke-width="1.5"/><line x1="509.7" y1="322.3" x2="390.9" y2="225.1" stroke="#c5d9e0" stroke-width="2" /><line x1="434.1" y1="347.95" x2="617.7" y2="148.15" stroke="#c5d9e0" stroke-width="2" /><line x1="555.6" y1="272.35" x2="436.8" y2="175.15" stroke="#c5d9e0" stroke-width="2" /><line x1="404.4" y1="323.65" x2="588" y2="123.85" stroke="#c5d9e0" stroke-width="2" /><line x1="601.5" y1="222.4" x2="482.7" y2="125.2" stroke="#c5d9e0" stroke-width="2" /><line x1="374.7" y1="299.35" x2="558.3" y2="99.55" stroke="#c5d9e0" stroke-width="2" /><line x1="480" y1="298" x2="558.03" y2="316.36" stroke="#87959f" stroke-width="2" marker-end="url(#arrow)"/><text x="565.03" y="328.36" fill="#62707b" >u</text><line x1="480" y1="298" x2="429.51" y2="359.97" stroke="#87959f" stroke-width="2" marker-end="url(#arrow)"/><text x="409.51" y="371.96500000000003" fill="#62707b" >v</text><line x1="480" y1="298" x2="480" y2="194.72" stroke="#87959f" stroke-width="2" marker-end="url(#arrow)"/><text x="487" y="187.725" fill="#62707b" >w</text><line x1="480" y1="298" x2="525.9" y2="248.05" stroke="#176b91"  stroke-width="3" marker-end="url(#arrow)"/><line x1="480" y1="298" x2="450.3" y2="273.7" stroke="#bd5b18"  stroke-width="3" marker-end="url(#arrow)"/><text x="537.9" y="253.05" fill="#176b91" >c₁ = (1, 0, 1)</text><text x="273.3" y="285.7" fill="#bd5b18" >c₂ = (0, 1, 1)</text><line x1="466.5" y1="199.45" x2="466.5" y2="138.7" stroke="#ad2840" stroke-width="2" stroke-dasharray="5 4"/><circle cx="466.5" cy="199.45" r="6" fill="#28734d" /><circle cx="466.5" cy="138.7" r="6" fill="white" stroke="#ad2840" stroke-width="2.5"/><text x="482.5" y="207.45" fill="#28734d" >(1, 2, 3): reachable</text><text x="482.5" y="133.7" fill="#ad2840" >(1, 2, 4): outside</text><text x="25" y="403" fill="#273c4b" >Range: w = u + v.  Infinite plane shown as a patch.</text></g></svg>
