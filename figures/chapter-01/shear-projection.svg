<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">水平剪切与坐标投影 / Horizontal Shear and Coordinate Projection</title><desc id="desc">左图单位正方形的顶点经 H1(x,y)=(x+y,y) 变成平行四边形；右图 P(x,y)=(x,0) 将(1,1)和(1,2)映到(1,0)。两图坐标轴保持固定。</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22688b"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b25327"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#667681"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7956a0"/></marker></defs>
<style>text{font-family:system-ui,"Droid Sans Fallback",sans-serif;font-size:17px;fill:#243746}.small{font-size:15px}.heading{font-size:20px;font-weight:600}</style><rect width="960" height="430" fill="white"/>
<text x="25" y="32" class="heading">水平剪切 / Horizontal shear</text>
<text x="515" y="32" class="heading">坐标投影 / Coordinate projection</text>
