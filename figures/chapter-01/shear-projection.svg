<text x="102" y="330" class="">O</text>
<polygon points="95,310 230,310 230,175 95,175" fill="#e8f1f7" fill-opacity=".65" stroke="#22688b" stroke-width="2"/>
<polygon points="95,310 230,310 365,175 230,175" fill="#fff0e5" fill-opacity=".65" stroke="#b25327" stroke-width="2"/>
<line x1="95" y1="175" x2="230" y2="175" stroke="#b25327" stroke-width="2" marker-end="url(#orange)" stroke-dasharray="6 5"/>
<line x1="230" y1="175" x2="365" y2="175" stroke="#b25327" stroke-width="2" marker-end="url(#orange)" stroke-dasharray="6 5"/>
