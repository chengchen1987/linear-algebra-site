<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="解的点集、位置向量与位移 / Solution points, position vectors and displacement" data-parameter="0.5"><title>解的点集、位置向量与位移 / Solution points, position vectors and displacement</title><desc>固定输入R3原点O。蓝线是齐次解点集，橙线是非齐次解点集。当前参数0.5；蓝点tu=(-1,0.5,0.5)，橙点x=(0,1.5,0.5)。位置箭头从O指向当前点；灰虚箭头从tu到x表示加上xp的位移，不是解向量箭头。B maps every orange point to b=(2,5), and every blue point to zero in separate output R2. Lines are infinite, shown in projection; lengths and angles cannot be inferred.</desc><defs><marker id="solution-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="650" fill="white"/><g font-family="DejaVu Sans, Droid Sans Fallback, sans-serif" font-size="21"><text x="25" y="33" fill="#273c4b" >输入 R³：解的点集 / Input solution sets</text><text x="25" y="61" fill="#273c4b" font-size="16">固定原点 O；二维投影 / Fixed origin; 2D projection</text><rect x="700" y="12" width="285" height="450" rx="8" fill="#f4f7f9" stroke="#d6e0e6"/><text x="718" y="40" fill="#273c4b" font-size="20">输出 R² / Output</text><line x1="345" y1="255" x2="460.6" y2="282.2" stroke="#9aa8b1" stroke-width="2" marker-end="url(#solution-arrow)"/><text x="465.6" y="301.2" fill="#62707b" font-size="16">x₁</text><line x1="345" y1="255" x2="270.2" y2="346.8" stroke="#9aa8b1" stroke-width="2" marker-end="url(#solution-arrow)"/><text x="245.2" y="365.8" fill="#62707b" font-size="16">x₂</text><line x1="345" y1="255" x2="345" y2="102" stroke="#9aa8b1" stroke-width="2" marker-end="url(#solution-arrow)"/><text x="350" y="93" fill="#62707b" font-size="16">x₃</text><line x1="589.8" y1="347.48" x2="100.2" y2="162.52" stroke="#176b91"  data-role="homogeneous-set" stroke-width="2" opacity=".65"/><line x1="610.2" y1="406.98" x2="120.6" y2="222.02" stroke="#bd5b18"  data-role="nonhomogeneous-set" stroke-width="2" opacity=".65"/><text x="70" y="124" fill="#176b91" >S₀ = {t u : t ∈ R}</text><text x="82" y="447" fill="#bd5b18" >Sᵦ = {xₚ + t u : t ∈ R}</text><line x1="345" y1="255" x2="268.5" y2="226.1" stroke="#176b91"  data-role="homogeneous-vector" stroke-width="4" marker-end="url(#solution-arrow)" /><line x1="345" y1="255" x2="288.9" y2="285.6" stroke="#bd5b18"  data-role="solution-vector" stroke-width="4" marker-end="url(#solution-arrow)" /><line x1="268.5" y1="226.1" x2="288.9" y2="285.6" stroke="#66737b"  data-role="displacement" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#solution-arrow)"/><text x="294.7" y="255.85000000000002" fill="#4f5c65" font-size="17">＋xₚ</text><circle cx="268.5" cy="226.1" r="6" fill="#176b91" data-role="homogeneous-point"/><circle cx="288.9" cy="285.6" r="6" fill="#bd5b18" data-role="solution-point"/><circle cx="345" cy="255" r="3" fill="#273c4b" data-role="origin"/><text x="325" y="277" fill="#273c4b" font-size="18">O</text><text x="188.5" y="209.1" fill="#176b91" font-size="18">t u</text><text x="158.89999999999998" y="312.6" fill="#bd5b18" font-size="17">x(t) = xₚ + t u</text><text x="720" y="85" fill="#176b91" font-size="18">B: S₀ ↦ {0}</text><text x="720" y="115" fill="#bd5b18" font-size="18">B: Sᵦ ↦ {b}</text><line x1="757" y1="395" x2="944" y2="395" stroke="#9aa8b1" stroke-width="2" marker-end="url(#solution-arrow)"/><line x1="757" y1="395" x2="757" y2="175" stroke="#9aa8b1" stroke-width="2" marker-end="url(#solution-arrow)"/><text x="948" y="416" fill="#273c4b" >y₁</text><text x="741" y="165" fill="#273c4b" >y₂</text><line x1="757" y1="395" x2="817" y2="245" stroke="#bd5b18"  data-role="output-vector" stroke-width="4" marker-end="url(#solution-arrow)" /><circle cx="757" cy="395" r="5" fill="#176b91" /><circle cx="817" cy="245" r="6" fill="#bd5b18" /><text x="737" y="421" fill="#176b91" >0</text><text x="827" y="244" fill="#bd5b18" font-size="17">b = (2, 5)</text><text x="720" y="450" fill="#273c4b" font-size="17">B(t u) = 0;  B x(t) = b</text><text x="25" y="486" fill="#273c4b" font-size="18">t = 0.5;  u = (−2, 1, 1);  xₚ = (1, 1, 0)</text><circle cx="38" cy="522" r="5" fill="#176b91" /><text x="58" y="528" fill="#273c4b" font-size="17">点 / Point：一个解的坐标</text><line x1="515" y1="521" x2="555" y2="521" stroke="#bd5b18"  data-role="legend-vector" stroke-width="4" marker-end="url(#solution-arrow)" /><text x="570" y="528" fill="#273c4b" font-size="17">实箭头 / Position vector：从 O 出发</text><line x1="25" y1="558" x2="65" y2="558" stroke="#176b91"  stroke-width="2" opacity=".65"/><text x="78" y="565" fill="#273c4b" font-size="17">蓝：齐次解的点集；橙：非齐次解的点集</text><line x1="515" y1="558" x2="555" y2="558" stroke="#66737b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#solution-arrow)"/><text x="570" y="565" fill="#273c4b" font-size="17">虚箭头：加上 xₚ 的位移 / Displacement</text><text x="25" y="601" fill="#273c4b" font-size="17">线段仅代表无限直线的一部分；不可从投影读出长度或夹角。</text><text x="25" y="630" fill="#273c4b" font-size="17">↦ 表示跨空间的映射 / Map between spaces；不是位置箭头或位移。</text></g></svg>
