<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img"><title>C: input R² and output R³</title><desc>Equal units on fixed input axes; equal-foreshortening isometric output axes. Blue/green solid and red dashed position vectors all start at their own origin. The dotted segment changes the third coordinate by 1; it is not a position vector. This is a two-dimensional projection; 4 != 1+2 establishes nonmembership. Range is the plane w=u+v, not all of the codomain R3. Dashed arrow between panels indicates the mapping, not a position vector.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1000" height="555" fill="white"/><g font-family="DejaVu Sans, sans-serif" font-size="18"><text x="40" y="35" fill="#176b91" >Input / domain: R²</text><text x="585" y="35" fill="#28734d" >Output / codomain: R³</text><path d="M117 310 L315 310" fill="none" stroke="#62707b" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="323.25" y="315.5" fill="#62707b" >s</text><path d="M150 337.5 L150 112" fill="none" stroke="#62707b" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="156.6" y="103.75" fill="#62707b" >t</text><path d="M205 307 L205 313" fill="none" stroke="#62707b" stroke-width="2.5" /><text x="200" y="333" fill="#62707b" >1</text><path d="M147 255 L153 255" fill="none" stroke="#62707b" stroke-width="2.5" /><text x="128" y="261" fill="#62707b" >1</text><path d="M260 307 L260 313" fill="none" stroke="#62707b" stroke-width="2.5" /><text x="255" y="333" fill="#62707b" >2</text><path d="M147 200 L153 200" fill="none" stroke="#62707b" stroke-width="2.5" /><text x="128" y="206" fill="#62707b" >2</text><path d="M150 310 L205 200" fill="none" stroke="#176b91" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="218" y="198" fill="#176b91" >(1, 2)</text><text x="124" y="337" fill="#62707b" >O</text><polygon points="760,328 892.502,251.5 760,175 627.498,251.5" fill="#e6f1f4" stroke="#96b7c6"/><path d="M775.588 319 L643.087 242.5" fill="none" stroke="#c5d9e0" stroke-width="2.5" stroke-opacity=".65"/><path d="M744.412 319 L876.913 242.5" fill="none" stroke="#c5d9e0" stroke-width="2.5" stroke-opacity=".65"/><path d="M814.56 296.5 L682.058 220" fill="none" stroke="#c5d9e0" stroke-width="2.5" stroke-opacity=".65"/><path d="M705.44 296.5 L837.942 220" fill="none" stroke="#c5d9e0" stroke-width="2.5" stroke-opacity=".65"/><path d="M853.531 274 L721.029 197.5" fill="none" stroke="#c5d9e0" stroke-width="2.5" stroke-opacity=".65"/><path d="M666.469 274 L798.971 197.5" fill="none" stroke="#c5d9e0" stroke-width="2.5" stroke-opacity=".65"/><path d="M892.502 251.5 L760 175" fill="none" stroke="#c5d9e0" stroke-width="2.5" stroke-opacity=".65"/><path d="M627.498 251.5 L760 175" fill="none" stroke="#c5d9e0" stroke-width="2.5" stroke-opacity=".65"/><path d="M760 310 L865.222 370.75" fill="none" stroke="#62707b" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="873.222" y="382.75" fill="#62707b" >u</text><path d="M760 310 L654.778 370.75" fill="none" stroke="#62707b" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="632.778" y="382.75" fill="#62707b" >v</text><path d="M760 310 L760 134.5" fill="none" stroke="#62707b" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="768" y="129.5" fill="#62707b" >w</text><text x="766" y="330" fill="#62707b" >O</text><path d="M760 310 L721.029 242.5" fill="none" stroke="#28734d" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M760 310 L721.029 197.5" fill="none" stroke="#ad2840" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow)"/><path d="M721.029 242.5 L721.029 197.5" fill="none" stroke="#795697" stroke-width="2.5" stroke-dasharray="2 4"/><text x="738.029" y="225" fill="#795697" >Δw = 1</text><circle cx="721.029" cy="242.5" r="5" fill="#28734d"/><circle cx="721.029" cy="197.5" r="5" fill="white" stroke="#ad2840" stroke-width="2"/><text x="535" y="249" fill="#28734d" >(1, 2, 3)</text><path d="M633 244 L721.029 242.5" fill="none" stroke="#28734d" stroke-width="2.5" /><text x="538" y="160" fill="#ad2840" >(1, 2, 4): outside</text><path d="M697 166 L721.029 197.5" fill="none" stroke="#ad2840" stroke-width="2.5" /><path d="M356 220 L517 220" fill="none" stroke="#62707b" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="398" y="199" fill="#62707b" >T_C</text><text x="350" y="269" fill="#62707b" >(s, t) → (s, t, s+t)</text><text x="570" y="410" fill="#28734d" >Range: w = u + v (infinite plane)</text><text x="40" y="450" fill="#62707b" >Blue/green solid and red dashed arrows: position vectors from their own origins.</text><text x="40" y="480" fill="#62707b" >Gray dashed arrow between panels: mapping. Dotted segment: change in w.</text><text x="40" y="510" fill="#62707b" >2D projection: plane membership is decided by w = u + v; 4 ≠ 1 + 2.</text><text x="40" y="540" fill="#62707b" >Output axes have equal foreshortening; not all 3D angles are preserved.</text></g></svg>
