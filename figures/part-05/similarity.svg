<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title"><title id="title">同一变换的两种坐标 / The same map in two coordinate systems</title><rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs><g font-family="sans-serif" font-size="19" fill="#173846">
<rect x="25" y="40" width="260" height="125" rx="12" fill="#f1f7f9" stroke="#7392a0"/>
<text x="155" y="70" font-size="21" fill="#173846" text-anchor="middle">新坐标</text>
<text x="155" y="98" font-size="17" fill="#173846" text-anchor="middle">New coordinates</text>
<text x="155" y="141" font-size="25" fill="#173846" text-anchor="middle">(1, 2)ᵀ</text>
<rect x="435" y="40" width="260" height="125" rx="12" fill="#f1f7f9" stroke="#7392a0"/>
<text x="565" y="70" font-size="21" fill="#173846" text-anchor="middle">新坐标</text>
<text x="565" y="98" font-size="17" fill="#173846" text-anchor="middle">New coordinates</text>
<text x="565" y="141" font-size="25" fill="#173846" text-anchor="middle">(1, 4)ᵀ</text>
<rect x="25" y="240" width="260" height="125" rx="12" fill="#f1f7f9" stroke="#7392a0"/>
<text x="155" y="270" font-size="21" fill="#173846" text-anchor="middle">原空间向量</text>
<text x="155" y="298" font-size="17" fill="#173846" text-anchor="middle">Original vector</text>
<text x="155" y="341" font-size="25" fill="#173846" text-anchor="middle">(3, 5)ᵀ</text>
<rect x="435" y="240" width="260" height="125" rx="12" fill="#f1f7f9" stroke="#7392a0"/>
<text x="565" y="270" font-size="21" fill="#173846" text-anchor="middle">原空间向量</text>
<text x="565" y="298" font-size="17" fill="#173846" text-anchor="middle">Original vector</text>
<text x="565" y="341" font-size="25" fill="#173846" text-anchor="middle">(5, 9)ᵀ</text>
<line x1="295" y1="105" x2="425" y2="105" stroke="#185b91" stroke-width="2" marker-end="url(#arrow)"/>
<text x="360" y="80" font-size="23" fill="#185b91" text-anchor="middle">D</text>
<line x1="295" y1="300" x2="425" y2="300" stroke="#b25725" stroke-width="2" marker-end="url(#arrow)"/>
<text x="360" y="275" font-size="23" fill="#b25725" text-anchor="middle">A</text>
<line x1="155" y1="175" x2="155" y2="230" stroke="#16725c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="175" y="210" font-size="23" fill="#16725c" text-anchor="start">P</text>
<line x1="565" y1="230" x2="565" y2="175" stroke="#16725c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="585" y="210" font-size="23" fill="#16725c" text-anchor="start">P⁻¹</text>
<text x="360" y="390" font-size="23" fill="#173846" text-anchor="middle">D = P⁻¹AP     AP = PD</text>
</g></svg>
