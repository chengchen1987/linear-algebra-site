<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title"><title id="title">同一矩阵的两种初值 / Two initial states for the same matrix</title><rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke"/></marker></defs><g font-family="sans-serif" font-size="19" fill="#173846">
<text x="40" y="32" font-size="21" fill="#173846" text-anchor="start">纯 λ=1 模式 / Pure mode</text>
<text x="385" y="32" font-size="21" fill="#173846" text-anchor="start">含 λ=2 模式 / Mixed modes</text>
<line x1="70" y1="330" x2="272.0" y2="330" stroke="#82969e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="90" y1="355" x2="90" y2="85.0" stroke="#82969e" stroke-width="1" marker-end="url(#arrow)"/>
<text x="68" y="354" font-size="16" fill="#173846" text-anchor="start">O</text>
<line x1="90" y1="330" x2="160" y2="260" stroke="#185b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="110" y="235" font-size="19" fill="#185b91" text-anchor="start">xₖ = (1,1)</text>
<line x1="400" y1="330" x2="627" y2="330" stroke="#82969e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="420" y1="355" x2="420" y2="77" stroke="#82969e" stroke-width="1" marker-end="url(#arrow)"/>
<text x="398" y="354" font-size="16" fill="#173846" text-anchor="start">O</text>
<line x1="420" y1="330" x2="466" y2="261" stroke="#185b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="478" y="266" font-size="17" fill="#185b91" text-anchor="start">x0 = (2,3)</text>
<line x1="420" y1="330" x2="489" y2="215" stroke="#16725c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="501" y="220" font-size="17" fill="#16725c" text-anchor="start">x1 = (3,5)</text>
<line x1="466" y1="261" x2="489" y2="215" stroke="#684f83" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<line x1="420" y1="330" x2="535" y2="123" stroke="#b25725" stroke-width="3" marker-end="url(#arrow)"/>
<text x="547" y="128" font-size="17" fill="#b25725" text-anchor="start">x2 = (5,9)</text>
<line x1="489" y1="215" x2="535" y2="123" stroke="#684f83" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="30" y="392" font-size="18" fill="#173846" text-anchor="start">实线：位置向量 / Solid: position vectors</text>
<text x="30" y="420" font-size="18" fill="#173846" text-anchor="start">虚线：一步状态更新 / Dashed: one time step</text>
</g></svg>
