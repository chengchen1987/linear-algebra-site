<svg xmlns="http://www.w3.org/2000/svg" width="720" height="605" viewBox="0 0 720 605" role="img" aria-labelledby="title"><title id="title">同一向量、两组基与坐标 / One vector, two bases and their coordinates</title>
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs>
<g font-family="sans-serif" font-size="20" fill="#173846">
<text x="30" y="32" font-size="22">原向量空间 / Original vector space R²</text>
<line x1="90" y1="355" x2="470" y2="355" stroke="#7b9098" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="90" y1="355" x2="90" y2="89.0" stroke="#7b9098" stroke-width="1" marker-end="url(#arrow)"/>
<text x="72" y="378" >O</text>
<text x="475" y="376" >x</text>
<text x="72" y="79" >y</text>
<line x1="90" y1="355" x2="280" y2="355" stroke="#b25725" stroke-width="3" marker-end="url(#arrow)"/>
<text x="225" y="386" fill="#b25725">c₁ = (2,0)</text>
<line x1="90" y1="355" x2="90" y2="260" stroke="#b25725" stroke-width="3" marker-end="url(#arrow)"/>
<text x="100" y="222" fill="#b25725">c₂ = (0,1)</text>
<line x1="90" y1="355" x2="185" y2="355" stroke="#16725c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="103" y="332" fill="#16725c">b₁ = (1,0)</text>
<line x1="90" y1="355" x2="185" y2="260" stroke="#16725c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="183" y="250" fill="#16725c">b₂ = (1,1)</text>
<line x1="90" y1="355" x2="375" y2="165" stroke="#185b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="365" y="148" fill="#185b91">v = (3,2)</text>
<text x="420" y="280" font-size="22">v = b₁ + 2b₂</text>
<text x="420" y="315" font-size="22">v = 3c₁/2 + 2c₂</text>
<line x1="30" y1="412" x2="690" y2="412" stroke="#c1cfd3" stroke-width="1"/>
<text x="360" y="447" text-anchor="middle" font-size="21">下面是坐标描述 / Coordinate descriptions below</text>
<rect x="30" y="470" width="285" height="100" rx="12" fill="#f1f7f9" stroke="#7392a0"/>
<rect x="405" y="470" width="285" height="100" rx="12" fill="#f1f7f9" stroke="#7392a0"/>
<text x="173" y="508" text-anchor="middle" font-size="19">ℬ-坐标 / ℬ-coordinates</text>
<text x="173" y="548" text-anchor="middle" font-size="24">[v]ℬ = (1, 2)ᵀ</text>
<text x="548" y="508" text-anchor="middle" font-size="19">𝒞-坐标 / 𝒞-coordinates</text>
<text x="548" y="548" text-anchor="middle" font-size="24">[v]𝒞 = (3/2, 2)ᵀ</text>
<line x1="325" y1="520" x2="395" y2="520" stroke="#475c66" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>
