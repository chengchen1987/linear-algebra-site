<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title"><title id="title">多项式对象与两套坐标 / A polynomial and two coordinate descriptions</title>
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs>
<g font-family="sans-serif" font-size="20" fill="#173846">
<rect x="180" y="20" width="360" height="115" rx="12" fill="#f1f7f9" stroke="#7392a0"/>
<text x="360" y="52" text-anchor="middle">对象 / Object in P₂</text>
<text x="360" y="95" text-anchor="middle" font-size="26">p(t) = 2 + 3t + t²</text>
<line x1="270" y1="135" x2="170" y2="260" stroke="#475c66" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="450" y1="135" x2="550" y2="260" stroke="#475c66" stroke-width="2" marker-end="url(#arrow)"/>
<text x="128" y="195" >取坐标 / Encode</text>
<text x="449" y="195" >取坐标 / Encode</text>
<rect x="20" y="265" width="310" height="170" rx="12" fill="#f1f7f9" stroke="#7392a0"/>
<rect x="390" y="265" width="310" height="170" rx="12" fill="#f1f7f9" stroke="#7392a0"/>
<text x="175" y="300" text-anchor="middle">ℰ = (1, t, t²)</text>
<text x="175" y="350" text-anchor="middle" font-size="24">[p]ℰ = (2, 3, 1)ᵀ</text>
<text x="175" y="400" text-anchor="middle" font-size="17">ℰ-坐标空间 / ℰ-coordinates R³</text>
<text x="545" y="300" text-anchor="middle" font-size="19">𝒞 = (1, 1+t, 1+t+t²)</text>
<text x="545" y="350" text-anchor="middle" font-size="24">[p]𝒞 = (−1, 2, 1)ᵀ</text>
<text x="545" y="400" text-anchor="middle" font-size="17">𝒞-坐标空间 / 𝒞-coordinates R³</text>
</g></svg>
