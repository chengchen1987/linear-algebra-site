<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" role="img" aria-labelledby="title desc">
<title id="title">转置矩阵的作用 / The Action of the Transpose Matrix</title><desc id="desc">左右分别是实空间Rⁿ、Rᵐ，同侧两个子空间共享原点。行空间与列空间维数为r，零空间为n−r，左零空间为m−r。Aᵀ从右向左作用：一般输入y的输出Aᵀy属于行空间，左零空间向量w映射为左侧零向量。不是A的逆。实线箭头从各自原点出发表示向量，较粗虚线箭头表示矩阵作用。菱形形状、面积和夹角不表示实际几何关系。 Separate real ambient spaces; shared origins within each side. Solid arrows are vectors; dashed arrows are matrix actions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans",sans-serif;fill:#243442}.label{font-size:21px;font-weight:600}.small{font-size:16px}.math{font-size:25px}.en{font-size:16px;fill:#42566a}</style>
<rect width="760" height="690" fill="white"/>
<style>.space-name{font-size:24px;font-weight:600}.space-en{font-size:18px}.formula{font-size:22px}.vec{font-weight:700}.action-label{font-size:22px;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.origin-label{font-size:21px}</style>
<text x="380.0" y="33" class="formula" text-anchor="middle">A ∈ ℝᵐˣⁿ，r = rank(A)</text>
<text x="380.0" y="68" class="math" text-anchor="middle">Aᵀ : ℝᵐ → ℝⁿ</text>
<rect x="10" y="88" width="340" height="546" rx="10" fill="#f5f8fb" stroke="#c4cfd9" stroke-width="2" stroke-dasharray=""/>
<text x="180" y="119" class="space-name" text-anchor="middle">ℝⁿ</text>
<rect x="410" y="88" width="340" height="546" rx="10" fill="#f5f8fb" stroke="#c4cfd9" stroke-width="2" stroke-dasharray=""/>
<text x="580" y="119" class="space-name" text-anchor="middle">ℝᵐ</text>
<polygon id="space-row" points="180,350 35,255 180,160 325,255" fill="#dfebf7" stroke="#315c88" stroke-width="1.8"/>
<text x="180" y="211" class="space-name" text-anchor="middle">行空间</text>
<text x="180" y="236" class="space-en" text-anchor="middle">Row Space</text>
<text x="180" y="265" class="formula" text-anchor="middle">Row(A) = Col(Aᵀ)</text>
<text x="180" y="294" class="formula" text-anchor="middle">dim = r</text>
<polygon id="space-null" points="180,350 325,480 180,610 35,480" fill="#faf0d9" stroke="#896222" stroke-width="1.8"/>
<text x="180" y="460" class="space-name" text-anchor="middle">零空间</text>
<text x="180" y="485" class="space-en" text-anchor="middle">Null Space</text>
<text x="180" y="514" class="formula" text-anchor="middle">Nul(A)</text>
<text x="180" y="543" class="formula" text-anchor="middle">dim = n − r</text>
<polygon id="space-column" points="580,350 435,255 580,160 725,255" fill="#dcefe9" stroke="#27746d" stroke-width="1.8"/>
<text x="580" y="211" class="space-name" text-anchor="middle">列空间</text>
<text x="580" y="236" class="space-en" text-anchor="middle">Column Space</text>
<text x="580" y="265" class="formula" text-anchor="middle">Col(A)</text>
<text x="580" y="294" class="formula" text-anchor="middle">dim = r</text>
<polygon id="space-left-null" points="580,350 725,480 580,610 435,480" fill="#eee3f3" stroke="#765184" stroke-width="1.8"/>
<text x="580" y="460" class="space-name" text-anchor="middle">左零空间</text>
<text x="580" y="485" class="space-en" text-anchor="middle">Left Null Space</text>
<text x="580" y="514" class="formula" text-anchor="middle">Nul(Aᵀ)</text>
<text x="580" y="543" class="formula" text-anchor="middle">dim = m − r</text>
<path id="vector-general" d="M580 350 L430 369" fill="none" stroke="#243442" stroke-width="2.2" marker-end="url(#arrow)"/>
<path id="vector-null" d="M580 350 L502 423" fill="none" stroke="#765184" stroke-width="2.2" marker-end="url(#arrow)"/>
<path id="vector-output" d="M180 350 L120 305" fill="none" stroke="#315c88" stroke-width="2.2" marker-end="url(#arrow)"/>
<path id="action-general" d="M430 369 C350 310 330 305 120 305" fill="none" stroke="#334d65" stroke-width="3.2" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<path id="action-null" d="M502 423 C350 455 290 410 180 350" fill="none" stroke="#765184" stroke-width="3.2" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="472" y="402" class="formula" text-anchor="end"><tspan class="vec">y</tspan></text>
<text x="505" y="450" class="formula" text-anchor="end"><tspan class="vec">w</tspan></text>
<text x="116" y="334" class="formula" text-anchor="end">Aᵀ<tspan class="vec">y</tspan></text>
<text x="380.0" y="300" class="action-label" text-anchor="middle">Aᵀ</text>
<text x="380.0" y="475" class="action-label" text-anchor="middle">Aᵀ<tspan class="vec">w</tspan> = <tspan class="vec">0</tspan>ₙ</text>
<circle id="origin-ₙ" cx="180" cy="350" r="4" fill="#243442"/>
<text x="202" y="343" class="origin-label" text-anchor="start"><tspan class="vec">0</tspan>ₙ</text>
<circle id="origin-ₘ" cx="580" cy="350" r="4" fill="#243442"/>
<text x="602" y="343" class="origin-label" text-anchor="start"><tspan class="vec">0</tspan>ₘ</text>
<polyline points="30.00,664.00 70.00,664.00" fill="none" stroke="#243442" stroke-width="2.2" stroke-dasharray=""/>
<text x="80" y="671" class="small" >向量 / Vector</text>
<polyline points="380.00,664.00 425.00,664.00" fill="none" stroke="#243442" stroke-width="3.2" stroke-dasharray="9 6"/>
<text x="435.0" y="671" class="small" >矩阵作用 / Matrix action</text>
</svg>
