<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">四个基本子空间 / Four Fundamental Subspaces</title><desc id="desc">包含框示意，不是几何平面。输入环境Rⁿ包含行空间与零空间；输出环境Rᵐ包含列空间与左零空间。所有输入经A的像组成列空间，零空间映到零。Containment schematic, not a geometric drawing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans",sans-serif;fill:#243442}.label{font-size:21px;font-weight:600}.small{font-size:16px}.math{font-size:25px}.en{font-size:16px;fill:#42566a}</style>
<rect width="960" height="570" fill="white"/>
<text x="20" y="30" class="label" >四个基本子空间</text>
<text x="20" y="54" class="en" >Four Fundamental Subspaces</text>
<rect x="20" y="85" width="385" height="340" rx="10" fill="#f8fafc" stroke="#65798a" stroke-width="2" stroke-dasharray=""/>
<text x="36" y="117" class="label" >输入环境 ℝⁿ</text>
<text x="36" y="141" class="en" >Input ambient space</text>
<rect x="555" y="85" width="385" height="340" rx="10" fill="#f8fafc" stroke="#65798a" stroke-width="2" stroke-dasharray=""/>
<text x="571" y="117" class="label" >输出环境 ℝᵐ</text>
<text x="571" y="141" class="en" >Output ambient space</text>
<rect x="32" y="160" width="361" height="118" rx="10" fill="white" stroke="#315c88" stroke-width="2" stroke-dasharray=""/>
<text x="46" y="191" class="math" >Row(A)</text>
<text x="250" y="190" class="small" >dim = r</text>
<text x="46" y="224" class="small" >约束系数：行的线性组合</text>
<text x="46" y="251" class="en" >Combinations of constraint rows</text>
<rect x="32" y="292" width="361" height="118" rx="10" fill="white" stroke="#896222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="46" y="323" class="math" >Nul(A)</text>
<text x="250" y="322" class="small" >dim = n − r</text>
<text x="46" y="356" class="small" >不改变输出的输入变化</text>
<text x="46" y="383" class="en" >Input changes with zero output</text>
<rect x="567" y="160" width="361" height="118" rx="10" fill="white" stroke="#27746d" stroke-width="2" stroke-dasharray=""/>
<text x="581" y="191" class="math" >Col(A)</text>
<text x="785" y="190" class="small" >dim = r</text>
<text x="581" y="224" class="small" >所有可达输出</text>
<text x="581" y="251" class="en" >All attainable outputs</text>
<rect x="567" y="292" width="361" height="118" rx="10" fill="white" stroke="#765184" stroke-width="2" stroke-dasharray="6 4"/>
<text x="581" y="323" class="math" >Nul(Aᵀ)</text>
<text x="785" y="322" class="small" >dim = m − r</text>
<text x="581" y="356" class="small" >使方程左边相消的组合系数</text>
<text x="581" y="383" class="en" >Coefficients cancelling equation rows</text>
<polyline points="405.00,105.00 535.00,105.00 535.00,220.00 567.00,220.00" fill="none" stroke="#243442" stroke-width="2.4" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="418" y="94" class="small" >A : ℝⁿ → ℝᵐ</text>
<text x="423" y="245" class="small" >像为 Col(A)</text>
<text x="425" y="268" class="en" >Image of A</text>
<polyline points="397.00,350.00 470.00,350.00 470.00,273.00 567.00,273.00" fill="none" stroke="#896222" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="580" y="273" class="small" >0</text>
<text x="479" y="312" class="small" >映到 0</text>
<text x="478" y="335" class="en" >to zero</text>
<text x="20" y="472" class="small" >实线框与虚线框区分四个角色；框的形状、大小和间距不表示几何关系。</text>
<text x="20" y="499" class="en" >Boxes distinguish roles and membership; their shapes, sizes, and spacing are not geometric.</text>
<text x="20" y="536" class="math" >r = rank(A)</text>
<text x="265" y="536" class="math" >A(Nul(A)) = {0}</text>
<text x="590" y="536" class="math" >A(ℝⁿ) = Col(A)</text>
</svg>
