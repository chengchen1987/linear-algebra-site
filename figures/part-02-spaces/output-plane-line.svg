<title id="title">输出侧的平面与直线 / The Plane and Line on the Output Side</title><desc id="desc">同一正投影下的真实输出空间R³：列空间为b₃=b₁+b₂，左零空间由ℓ=(−1,−1,1)ᵀ张成。a₁=(1,0,1)ᵀ、a₃=(0,1,1)ᵀ与ℓ的实线箭头均从原点出发。平面和直线无限延伸，虚线轮廓仅限定绘图区；不画输入空间R⁴。 / A plane and a line in R³, with a single orthographic camera and equal world units.</desc>
