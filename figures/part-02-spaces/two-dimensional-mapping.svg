<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">两个输入，同一个输出 / Two Inputs, One Output</title><desc id="desc">B=[[1,1],[2,2]]。左右为独立的等比例R²坐标面，输入轴x₁/x₂，输出轴b₁/b₂。x_r=(1,1)、z=(2,−2)、x=(3,−1)，x_r与x均映到b=(2,4)，z映到右侧原点。四条实直线为四个子空间。浅灰平行四边形辅助线只表示相加；粗虚线是点到点的B作用。 / Equal-scale coordinate planes; three exact input-to-image correspondences.</desc>
