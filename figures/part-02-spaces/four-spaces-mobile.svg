<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1050" role="img" aria-labelledby="title desc">
<title id="title">四个基本子空间 / Four Fundamental Subspaces</title><desc id="desc">包含框示意，不是几何平面。输入环境Rⁿ包含行空间与零空间；输出环境Rᵐ包含列空间与左零空间。所有输入经A的像组成列空间，零空间映到零。Containment schematic, not a geometric drawing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans",sans-serif;fill:#243442}.label{font-size:21px;font-weight:600}.small{font-size:16px}.math{font-size:25px}.en{font-size:16px;fill:#42566a}</style>
<rect width="420" height="1050" fill="white"/>
<text x="20" y="30" class="label" >四个基本子空间</text>
<text x="20" y="54" class="en" >Four Fundamental Subspaces</text>
<rect x="16" y="76" width="388" height="340" rx="10" fill="#f8fafc" stroke="#65798a" stroke-width="2" stroke-dasharray=""/>
<text x="32" y="108" class="label" >输入环境 ℝⁿ</text>
<text x="32" y="132" class="en" >Input ambient space</text>
<rect x="16" y="610" width="388" height="340" rx="10" fill="#f8fafc" stroke="#65798a" stroke-width="2" stroke-dasharray=""/>
<text x="32" y="642" class="label" >输出环境 ℝᵐ</text>
<text x="32" y="666" class="en" >Output ambient space</text>
<rect x="28" y="151" width="364" height="118" rx="10" fill="white" stroke="#315c88" stroke-width="2" stroke-dasharray=""/>
<text x="42" y="182" class="math" >Row(A)</text>
<text x="246" y="181" class="small" >dim = r</text>
<text x="42" y="215" class="small" >约束系数：行的线性组合</text>
<text x="42" y="242" class="en" >Combinations of constraint rows</text>
<rect x="28" y="283" width="364" height="118" rx="10" fill="white" stroke="#896222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="42" y="314" class="math" >Nul(A)</text>
<text x="246" y="313" class="small" >dim = n − r</text>
<text x="42" y="347" class="small" >不改变输出的输入变化</text>
<text x="42" y="374" class="en" >Input changes with zero output</text>
<rect x="28" y="685" width="364" height="118" rx="10" fill="white" stroke="#27746d" stroke-width="2" stroke-dasharray=""/>
<text x="42" y="716" class="math" >Col(A)</text>
<text x="246" y="715" class="small" >dim = r</text>
<text x="42" y="749" class="small" >所有可达输出</text>
<text x="42" y="776" class="en" >All attainable outputs</text>
<rect x="28" y="817" width="364" height="118" rx="10" fill="white" stroke="#765184" stroke-width="2" stroke-dasharray="6 4"/>
<text x="42" y="848" class="math" >Nul(Aᵀ)</text>
<text x="246" y="847" class="small" >dim = m − r</text>
<text x="42" y="881" class="small" >使方程左边相消的组合系数</text>
<text x="42" y="908" class="en" >Coefficients cancelling equation rows</text>
<text x="25" y="453" class="label" >A：所有输入 → 可达输出</text>
<text x="25" y="479" class="en" >A maps all inputs onto Col(A)</text>
<text x="25" y="513" class="math" >A(Nul(A)) = {0}</text>
<text x="25" y="540" class="en" >零空间中的输入都映到零 / Null inputs → 0</text>
<polyline points="210.00,556.00 210.00,600.00" fill="none" stroke="#243442" stroke-width="2.4" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="20" y="989" class="small" >框仅表示所属空间，不表示几何形状。</text>
<text x="20" y="1016" class="en" >Boxes show membership, not geometry.</text>
</svg>
