<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="title desc"><title id="title">Stretch and shear in two orders</title><desc id="desc">Left: e2 to (1,1) by S, then (2,1) by H. Right: H leaves e2 unchanged; S then sends it to (1,1). All arrows start at the origin; both axes have the same scale.</desc><defs><marker id="input" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#236c9a"/></marker><marker id="middle" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#ba6418"/></marker><marker id="final" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#703d91"/></marker><marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#637783"/></marker></defs><rect width="820" height="350" fill="white"/><g font-family="system-ui,sans-serif" fill="#243746"><text x="25" y="32" font-size="19" font-weight="600">先 S 后 H / S then H</text><text x="25" y="60" font-size="17">HS e₂ = (2,1)ᵀ</text><path d="M60 240 L320 240" stroke="#637783" marker-end="url(#axis)"/><path d="M90 264 L90 90" stroke="#637783" marker-end="url(#axis)"/><text x="72" y="259" font-size="15">O</text><text x="322" y="245">u</text><text x="86" y="82">v</text><path d="M170 236v8" stroke="#637783"/><text x="166" y="262" font-size="14">1</text><path d="M250 236v8" stroke="#637783"/><text x="246" y="262" font-size="14">2</text><path d="M86 160h8" stroke="#637783"/><text x="70" y="163" font-size="14">1</text><path d="M90 240 L90 160" stroke="#236c9a" stroke-width="3" marker-end="url(#input)" fill="none"/><path d="M90 240 L170 160" stroke="#ba6418" stroke-width="3" marker-end="url(#middle)" fill="none"/><path d="M90 240 L250 160" stroke="#703d91" stroke-width="3" marker-end="url(#final)" fill="none"/><text x="38" y="140" fill="#236c9a" font-size="16">e₂</text><text x="135" y="140" fill="#ba6418" font-size="16">S e₂</text><text x="242" y="174" fill="#703d91" font-size="16">HS e₂</text><text x="435" y="32" font-size="19" font-weight="600">先 H 后 S / H then S</text><text x="435" y="60" font-size="17">SH e₂ = (1,1)ᵀ</text><path d="M470 240 L730 240" stroke="#637783" marker-end="url(#axis)"/><path d="M500 264 L500 90" stroke="#637783" marker-end="url(#axis)"/><text x="482" y="259" font-size="15">O</text><text x="732" y="245">u</text><text x="496" y="82">v</text><path d="M580 236v8" stroke="#637783"/><text x="576" y="262" font-size="14">1</text><path d="M660 236v8" stroke="#637783"/><text x="656" y="262" font-size="14">2</text><path d="M496 160h8" stroke="#637783"/><text x="480" y="163" font-size="14">1</text><path d="M500 240 L500 160" stroke="#236c9a" stroke-width="3" marker-end="url(#input)" fill="none"/><path d="M500 240 L580 160" stroke="#703d91" stroke-width="3" marker-end="url(#final)" fill="none"/><text x="440" y="140" fill="#236c9a" font-size="16">e₂ = H e₂</text><text x="570" y="140" fill="#703d91" font-size="16">SH e₂</text><text x="435" y="300" font-size="16">输入与中间像重合 / Input = intermediate</text><text x="25" y="330" font-size="15">蓝：输入 / Input　橙：中间像 / Intermediate　紫：最终像 / Final</text></g></svg>